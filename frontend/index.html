<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
  <link rel="shortcut icon" href="/favicon.ico?v=2" />
  <link rel="apple-touch-icon" href="/favicon-16x16.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <title>LeetCode-Learn</title>
  <script>
    // Auto-reload once if an old cached index.html fails to load updated Vite modules
    window.addEventListener('error', function (e) {
      var msg = (e && e.message) || '';
      if (msg.indexOf('module script') !== -1 || msg.indexOf('MIME type') !== -1) {
        if (!sessionStorage.getItem('chunk_recovered')) {
          sessionStorage.setItem('chunk_recovered', 'true');
          window.location.reload(true);
        }
      }
    });
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
